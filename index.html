<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>キロノヴァ極限検定</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg1:#050712;
    --bg2:#12071f;
    --card:#101426ee;
    --accent:#8ad7ff;
    --accent2:#ffb86b;
    --danger:#ff5c8a;
    --ok:#64ffb4;
    --text:#eef3ff;
    --muted:#aeb8d8;
  }
  * { box-sizing: border-box; }
  body {
    margin:0;
    min-height:100vh;
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background:
      radial-gradient(circle at 20% 10%, #273c75 0%, transparent 28%),
      radial-gradient(circle at 80% 20%, #702459 0%, transparent 22%),
      radial-gradient(circle at 50% 90%, #1d5c75 0%, transparent 28%),
      linear-gradient(135deg, var(--bg1), var(--bg2));
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:24px;
  }
  .app { width:min(980px, 100%); }
  .hero {
    border:1px solid #ffffff22;
    background:linear-gradient(135deg, #11182fcc, #080a15ee);
    border-radius:26px;
    padding:28px;
    box-shadow:0 24px 70px #0008;
    position:relative;
    overflow:hidden;
  }
  .hero::before {
    content:"";
    position:absolute;
    width:360px;
    height:360px;
    right:-120px;
    top:-140px;
    background:radial-gradient(circle, #ffb86b55, transparent 60%);
    filter:blur(4px);
  }
  h1 {
    margin:0 0 8px;
    font-size:clamp(28px, 5vw, 54px);
    letter-spacing:.04em;
  }
  .subtitle {
    color:var(--muted);
    line-height:1.7;
    margin-bottom:20px;
  }
  .badge-row {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:14px 0 22px;
  }
  .badge {
    border:1px solid #ffffff22;
    background:#ffffff0d;
    padding:7px 11px;
    border-radius:999px;
    font-size:13px;
    color:#dbe8ff;
  }
  .panel {
    margin-top:18px;
    border:1px solid #ffffff22;
    background:var(--card);
    border-radius:24px;
    padding:22px;
    box-shadow:0 18px 50px #0005;
  }
  .topline {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
  }
  .progress-wrap {
    height:10px;
    background:#ffffff14;
    border-radius:999px;
    overflow:hidden;
    margin-bottom:18px;
  }
  .progress {
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    transition:.35s;
  }
  .qnum { color:var(--accent); font-weight:700; }
  .difficulty { color:var(--accent2); font-weight:700; font-size:14px; }
  .question {
    font-size:clamp(18px, 3vw, 25px);
    line-height:1.65;
    font-weight:700;
    margin:8px 0 18px;
  }
  .choices {
    display:grid;
    gap:12px;
  }
  button.choice {
    width:100%;
    text-align:left;
    border:1px solid #ffffff26;
    background:linear-gradient(135deg, #151a31, #0c1020);
    color:var(--text);
    border-radius:18px;
    padding:15px 16px;
    font-size:15px;
    line-height:1.65;
    cursor:pointer;
    transition:.18s;
  }
  button.choice:hover {
    transform:translateY(-2px);
    border-color:#8ad7ff99;
    box-shadow:0 10px 24px #0006;
  }
  button.choice.correct {
    border-color:var(--ok);
    background:linear-gradient(135deg, #0f3b2b, #10251f);
  }
  button.choice.wrong {
    border-color:var(--danger);
    background:linear-gradient(135deg, #3b1022, #22101a);
  }
  .explain {
    display:none;
    margin-top:18px;
    padding:16px;
    border-radius:18px;
    border:1px solid #ffffff22;
    background:#ffffff0d;
    color:#dce7ff;
    line-height:1.75;
  }
  .controls {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:18px;
  }
  .mainbtn {
    border:0;
    border-radius:999px;
    padding:12px 18px;
    font-weight:800;
    cursor:pointer;
    color:#06101c;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .ghost {
    border:1px solid #ffffff2d;
    background:#ffffff10;
    color:var(--text);
    border-radius:999px;
    padding:12px 18px;
    font-weight:700;
    cursor:pointer;
  }
  .result { display:none; text-align:center; }
  .score {
    font-size:clamp(42px, 9vw, 82px);
    font-weight:900;
    margin:10px 0;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip:text;
    color:transparent;
  }
  .rank {
    font-size:24px;
    font-weight:900;
    margin:12px 0;
  }
  .small {
    color:var(--muted);
    line-height:1.8;
  }
  .modebox {
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:12px;
    margin-top:16px;
  }
  .mode {
    border:1px solid #ffffff22;
    background:#ffffff0c;
    border-radius:18px;
    padding:15px;
  }
  .mode b { color:var(--accent); }
  @media (max-width:600px) {
    body { padding:12px; }
    .hero, .panel { padding:18px; border-radius:20px; }
  }
</style>
</head>
<body>
<div class="app">

  <section class="hero" id="startScreen">
    <h1>キロノヴァ極限検定</h1>
    <div class="subtitle">
      中性子星合体、r過程元素合成、ランタノイド不透明度、GW170817/AT2017gfo、放射輸送モデルまで問う、
      推測ほぼ不能の超マニアック天体物理クイズです。
    </div>

    <div class="badge-row">
      <span class="badge">難度：研究会の懇親会で沈黙するレベル</span>
      <span class="badge">全20問</span>
      <span class="badge">4択すべて微妙にありそう</span>
      <span class="badge">解説付き</span>
    </div>

    <div class="modebox">
      <div class="mode"><b>出題範囲</b><br>GW170817、AT2017gfo、短ガンマ線バースト、r過程、Ye、ランタノイド、スペクトル、放射性加熱。</div>
      <div class="mode"><b>ひっかけ方</b><br>「青い＝高温」だけでは解けません。電子割合、組成、不透明度、時間発展を組み合わせます。</div>
      <div class="mode"><b>判定</b><br>16問以上で「キロノヴァ観測班」、19問以上で「r過程の亡霊」です。</div>
    </div>

    <div class="controls">
      <button class="mainbtn" onclick="startQuiz()">検定開始</button>
      <button class="ghost" onclick="shuffleQuestions()">問題順をシャッフル</button>
    </div>
  </section>

  <section class="panel" id="quizScreen" style="display:none;">
    <div class="topline">
      <div class="qnum" id="qnum"></div>
      <div class="difficulty" id="difficulty"></div>
    </div>
    <div class="progress-wrap"><div class="progress" id="progress"></div></div>
    <div class="question" id="question"></div>
    <div class="choices" id="choices"></div>
    <div class="explain" id="explain"></div>
    <div class="controls">
      <button class="mainbtn" id="nextBtn" onclick="nextQuestion()" style="display:none;">次の観測へ</button>
      <button class="ghost" onclick="restart()">最初から</button>
    </div>
  </section>

  <section class="panel result" id="resultScreen">
    <h2>観測終了</h2>
    <div class="score" id="score"></div>
    <div class="rank" id="rank"></div>
    <p class="small" id="comment"></p>
    <div class="controls" style="justify-content:center;">
      <button class="mainbtn" onclick="restart()">再挑戦</button>
      <button class="ghost" onclick="reviewMode()">全問レビュー</button>
    </div>
  </section>

</div>

<script>
const originalQuestions = [
  { level:"超難問", q:"キロノヴァの赤色成分が長く残りやすい主因として、最も本質に近いものはどれか。", choices:["自由中性子のβ崩壊で生成した陽子が、可視光域の連続吸収を急激に下げるため","ランタノイドやアクチノイドを含む物質の束縛-束縛遷移が多く、不透明度が高くなるため","合体後の降着円盤が水素再結合線を持続的に放射し、Hαが赤色超過を作るため","衝撃波ブレイクアウトが赤外線でのみ熱化し、青色光子が生成されないため"], answer:1, exp:"赤色成分では、ランタノイドなど重いr過程元素の複雑な電子構造により束縛-束縛遷移が非常に多くなり、不透明度が高くなります。そのため光子の拡散時間が長くなり、ピークは遅く、波長は赤外側へ寄ります。" },
  { level:"地獄級", q:"青いキロノヴァ成分を生みやすい放出物の特徴として、最も妥当な組み合わせはどれか。", choices:["低Ye・高ランタノイド量・低速度・高不透明度","高Ye・低ランタノイド量・比較的高速・低不透明度","高Ye・高ランタノイド量・低速度・高不透明度","低Ye・低ランタノイド量・超低温・水素優勢組成"], answer:1, exp:"青い成分は一般に、電子割合Yeが比較的高く、ランタノイド生成が抑えられ、不透明度が低い放出物と関係します。低不透明度なら早く光が逃げ、可視光の青側で明るくなりやすいです。" },
  { level:"観測班級", q:"GW170817/AT2017gfoがキロノヴァ研究で特に重要視される理由として、最も正確なものはどれか。", choices:["初めて白色矮星同士の合体が可視光で確認され、Ia型超新星の標準光源性が崩れたため","重力波と電磁波対応天体が結びつき、中性子星合体とキロノヴァを多面的に調べられたため","銀河中心ブラックホールの潮汐破壊現象として、r過程元素の生成量が直接測定されたため","長ガンマ線バースト残光として、初めて水素外層を持つ超巨星の爆発が同定されたため"], answer:1, exp:"GW170817は中性子星連星合体の重力波イベントで、AT2017gfoという電磁波対応天体が見つかりました。これにより、重力波・ガンマ線・紫外可視赤外観測が結びついた画期的事例になりました。" },
  { level:"理不尽級", q:"キロノヴァの光度曲線を一次的に支配する要素として、不適切なものはどれか。", choices:["放出物質量","放出物速度","不透明度","母銀河の渦状腕ピッチ角"], answer:3, exp:"光度曲線は放出物質量、速度、不透明度、放射性加熱率などに強く依存します。母銀河の渦状腕ピッチ角は環境情報としては面白くても、キロノヴァ光度曲線の一次支配因子ではありません。" },
  { level:"核物理級", q:"r過程元素合成における『r』の意味として正しいものはどれか。", choices:["radiative：放射捕獲が光学的厚い環境で起こること","rapid：β崩壊より速く中性子捕獲が進むこと","relativistic：相対論的速度の噴出物だけで元素が作られること","recurrent：同じ核種が周期的に再生成されること"], answer:1, exp:"r過程のrはrapidです。中性子捕獲がβ崩壊より速く進むことで、非常に中性子過剰な核種を経由し、重元素へ至ります。" },
  { level:"極悪", q:"電子割合 Ye が低い放出物で一般に起こりやすい核合成傾向はどれか。", choices:["陽子過剰となり、主にp核とリチウムだけが生成される","中性子が豊富で、重いr過程元素やランタノイド生成に進みやすい","水素燃焼が始まり、CNOサイクルで窒素のみが増える","電子捕獲が完全停止し、鉄より重い元素は生成できなくなる"], answer:1, exp:"Yeは電子数/バリオン数で、ほぼ陽子割合に対応します。Yeが低いほど中性子過剰で、重いr過程元素やランタノイド生成に進みやすくなります。" },
  { level:"スペクトル地獄", q:"AT2017gfoの初期スペクトルで個別元素の同定候補として有名になったものはどれか。", choices:["Sr、特に一価イオンの吸収特徴","H、特に強いバルマー系列のP-Cygniプロファイル","Li、特に6708Åの狭線発光","Fe、特にIa型超新星に似たFe IIIの林立"], answer:0, exp:"AT2017gfoではストロンチウム、特にSr IIに関連する特徴が議論されました。キロノヴァでは元素同定が非常に難しく、これは重要な成果として扱われます。" },
  { level:"観測波長級", q:"キロノヴァ観測で近赤外線が重要になる理由として、最も妥当なものはどれか。", choices:["合体直後から水素分子の回転線だけが近赤外で卓越するため","ランタノイドを含む高不透明度成分が時間とともに赤外側で目立つため","重力波が大気中で近赤外線に変換されるため","短ガンマ線バーストのジェット本体が常に近赤外線だけで見えるため"], answer:1, exp:"赤色キロノヴァ成分はランタノイドを含む高不透明度物質と関係し、光が遅れて出てくる上に、スペクトルが赤外側へ寄ります。したがって近赤外観測は非常に重要です。" },
  { level:"モデル判別級", q:"『青色成分が早く消え、赤色成分が長く続く』という観測事実から最も自然に示唆されるものはどれか。", choices:["単一温度・単一組成・単一速度の完全一様球だけで説明できる","不透明度や組成が異なる複数の放出成分が存在する可能性","全放射が中性子星表面の黒体放射のみで説明できる可能性","母銀河の星形成率が時間変化していること"], answer:1, exp:"青と赤の時間発展差は、低不透明度・高Ye成分と、高不透明度・低Ye成分など、異なる性質の放出物が混在することを示唆します。" },
  { level:"ガンマ線級", q:"GW170817と関連したGRB 170817Aの性質として、最もよく知られる特徴はどれか。", choices:["典型的な長ガンマ線バーストで、持続時間が数百秒に達した","短ガンマ線バーストに分類されるが、通常よりかなり暗いイベントだった","太陽フレア由来で、重力波イベントとは無関係だった","銀河中心活動核のジェット増光で、残光は観測されなかった"], answer:1, exp:"GRB 170817Aは短ガンマ線バーストとして扱われますが、距離を考慮すると通常の短GRBよりかなり低光度で、視線方向や構造化ジェットの議論につながりました。" },
  { level:"放射輸送級", q:"キロノヴァのピーク時刻が放出物質量 M、速度 v、不透明度 κ に依存するとき、定性的に正しい傾向はどれか。", choices:["Mが増えκが増えるほど、光の拡散時間が長くなりピークは遅くなりやすい","Mが増えκが増えるほど、必ずピークは青く短くなる","vが速いほど密度低下が遅くなり、必ずピークは数年後になる","κは光度曲線に影響せず、ピーク時刻は母銀河距離だけで決まる"], answer:0, exp:"物質量と不透明度が大きいほど光子は外へ逃げにくくなり、拡散時間が延びます。速度が大きいと膨張で密度が下がりやすく、ピーク時刻に影響します。" },
  { level:"名前トラップ級", q:"『キロノヴァ』という名称の由来として、最も近い説明はどれか。", choices:["古典新星の約1000倍の明るさを持ちうる現象として命名された","ケルビン温度が常に1000Kで固定されるため命名された","銀河中心から1000パーセク以内でしか発生しないため命名された","1キログラムの中性子物質だけで太陽光度を超えるため命名された"], answer:0, exp:"キロノヴァは古典新星の約1000倍程度の明るさというイメージから名付けられました。ただし実際の明るさや時間発展は条件により変わります。" },
  { level:"合体残骸級", q:"中性子星合体後の中心残骸として、理論的に考えられるものの組み合わせとして最も妥当なものはどれか。", choices:["必ず白色矮星になり、後にIa型超新星へ進む","超大質量ブラックホールだけが形成され、降着円盤は残らない","一時的な大質量中性子星、またはブラックホールと降着円盤など","主系列星に戻り、通常の水素燃焼を再開する"], answer:2, exp:"合体後は総質量や状態方程式により、短寿命または比較的長寿命の大質量中性子星、あるいはブラックホールと降着円盤などが考えられます。" },
  { level:"元素合成級", q:"キロノヴァが宇宙化学進化で注目される最大の理由に最も近いものはどれか。", choices:["ヘリウム燃焼だけで炭素を大量生成する唯一の天体現象だから","金、白金、希土類など重元素の起源候補として重要だから","酸素分子を直接放出して惑星大気を作る主因だから","鉄だけを大量生成し、Ia型超新星を完全に置き換えるから"], answer:1, exp:"中性子星合体は、金・白金・希土類・アクチノイドなど重いr過程元素の生成サイトとして非常に重要視されています。" },
  { level:"視線角級", q:"観測者の視線角がキロノヴァ/短GRBの解釈で重要になる理由として、最も妥当なものはどれか。", choices:["ジェットや放出物の幾何が非等方的で、観測される明るさや色が変わりうるため","視線角によって元素の原子番号そのものが変化するため","観測者が銀河面に対して垂直でなければ重力波が発生しないため","視線角が90度のときだけ中性子星が白色矮星に変化するため"], answer:0, exp:"合体噴出物やジェットは方向性を持つため、見る角度によりGRBの明るさ、残光、キロノヴァの色や光度曲線の見え方が変わります。" },
  { level:"崩壊熱級", q:"キロノヴァを光らせる主なエネルギー源として最も適切なものはどれか。", choices:["r過程で生成された不安定核種の放射性崩壊による加熱","母銀河中心ブラックホールの定常的な潮汐加熱","水素殻燃焼によるセファイド型脈動","星間塵による太陽光の反射"], answer:0, exp:"キロノヴァの光は、合体放出物内で生成された不安定なr過程核種の放射性崩壊による加熱が主なエネルギー源です。" },
  { level:"観測名級", q:"AT2017gfoという名称に関して、最も適切な説明はどれか。", choices:["GW170817に対応した電磁波トランジェントの名称として使われる","LIGOの重力波波形テンプレート名そのもの","中性子星の核状態方程式の一種","ランタノイド元素の周期表上の仮称"], answer:0, exp:"GW170817は重力波イベント名、AT2017gfoは対応する電磁波トランジェントの名称として使われます。" },
  { level:"不透明度級", q:"ランタノイドがキロノヴァ不透明度を大きくしやすい理由として、最も本質的なものはどれか。", choices:["f殻電子を持つ重元素で、非常に多数の束縛-束縛遷移が存在するため","すべてのランタノイドが完全電離してトムソン散乱だけになるため","ランタノイドが水素分子雲を作り、21cm線を吸収するため","原子核が光子を直接反射する鏡面構造を持つため"], answer:0, exp:"ランタノイドは複雑な電子構造を持ち、膨大な数の線遷移が光を吸収・散乱します。これが高い不透明度の主因です。" },
  { level:"比較天体級", q:"キロノヴァと通常のコア崩壊超新星の違いとして、最も妥当なものはどれか。", choices:["キロノヴァは主に中性子星合体などのコンパクト天体合体に伴う短命な放射現象である","キロノヴァは必ず水素外層を持つ赤色超巨星の爆発である","キロノヴァは太陽表面の黒点爆発であり、銀河系外では起こらない","キロノヴァは白色矮星の炭素爆燃のみで発生する"], answer:0, exp:"キロノヴァは中性子星合体などに伴う放射性崩壊駆動の短命トランジェントで、通常の大質量星のコア崩壊超新星とは機構が異なります。" },
  { level:"最終鬼畜", q:"『青いキロノヴァ成分＝必ずr過程が起きていない』という説明が危険な理由として、最も適切なものはどれか。", choices:["青い成分でも軽いr過程元素やランタノイド貧弱な元素合成は起こりうるため","青い成分は全て観測装置のゴーストで、実在しないため","青い成分は水素の核融合でしか作れず、中性子星合体とは無関係なため","青い成分は重力波の色を直接見ているだけで、物質放出を反映しないため"], answer:0, exp:"青い成分は『ランタノイドが少ない・不透明度が低い』ことを示唆しますが、r過程元素合成そのものがゼロとは限りません。軽いr過程元素やSrのような元素が関係する可能性があります。" }
];

let questions = [...originalQuestions];
let current = 0;
let score = 0;
let answered = false;
let review = false;

function shuffleQuestions() {
  questions = [...originalQuestions].sort(() => Math.random() - 0.5);
  alert("問題順をシャッフルしました。観測条件がさらに悪化しました。");
}

function startQuiz() {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("resultScreen").style.display = "none";
  document.getElementById("quizScreen").style.display = "block";
  current = 0;
  score = 0;
  review = false;
  showQuestion();
}

function showQuestion() {
  answered = false;
  const item = questions[current];
  document.getElementById("qnum").textContent = `Question ${current + 1} / ${questions.length}`;
  document.getElementById("difficulty").textContent = item.level;
  document.getElementById("question").textContent = item.q;
  document.getElementById("progress").style.width = `${(current / questions.length) * 100}%`;
  document.getElementById("explain").style.display = "none";
  document.getElementById("explain").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";

  const choicesDiv = document.getElementById("choices");
  choicesDiv.innerHTML = "";

  item.choices.forEach((choice, index) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = `<b>${String.fromCharCode(65 + index)}.</b> ${choice}`;
    btn.onclick = () => selectAnswer(index, btn);
    choicesDiv.appendChild(btn);
  });

  if (review) {
    const buttons = document.querySelectorAll(".choice");
    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if (i === item.answer) btn.classList.add("correct");
    });
    document.getElementById("explain").style.display = "block";
    document.getElementById("explain").innerHTML = `<b>解説：</b>${item.exp}`;
    document.getElementById("nextBtn").style.display = "inline-block";
  }
}

function selectAnswer(index, btn) {
  if (answered) return;
  answered = true;
  const item = questions[current];
  const buttons = document.querySelectorAll(".choice");

  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === item.answer) b.classList.add("correct");
    if (i === index && i !== item.answer) b.classList.add("wrong");
  });

  if (index === item.answer) score++;

  const judge = index === item.answer
    ? "正解。これは観測班に入れます。"
    : "不正解。これはランタノイドの霧に飲まれました。";

  document.getElementById("explain").style.display = "block";
  document.getElementById("explain").innerHTML = `<b>${judge}</b><br>${item.exp}`;
  document.getElementById("nextBtn").style.display = "inline-block";
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    finishQuiz();
  } else {
    showQuestion();
  }
}

function finishQuiz() {
  document.getElementById("quizScreen").style.display = "none";
  document.getElementById("resultScreen").style.display = "block";

  document.getElementById("score").textContent = `${score} / ${questions.length}`;

  let rank = "";
  let comment = "";

  if (score >= 19) {
    rank = "r過程の亡霊";
    comment = "ほぼ研究者です。選択肢の罠をここまで避けるのは、もはや中性子過剰物質と会話しています。";
  } else if (score >= 16) {
    rank = "キロノヴァ観測班";
    comment = "相当強いです。青色成分・赤色成分・Ye・ランタノイド不透明度の関係をかなり理解しています。";
  } else if (score >= 11) {
    rank = "重力波アラート対応係";
    comment = "十分マニアックです。ただしSr、Ye、ランタノイド、放射輸送のあたりでまだ落とし穴があります。";
  } else if (score >= 6) {
    rank = "短GRBを見失った観測者";
    comment = "テーマが難しすぎます。でもここからr過程、GW170817、AT2017gfoを押さえると一気に伸びます。";
  } else {
    rank = "ランタノイド霧の中";
    comment = "これは普通です。この検定は推測で解けないように作ってあります。むしろ数問取れた時点でかなり変態的です。";
  }

  document.getElementById("rank").textContent = rank;
  document.getElementById("comment").textContent = comment;
}

function restart() {
  current = 0;
  score = 0;
  review = false;
  document.getElementById("resultScreen").style.display = "none";
  document.getElementById("startScreen").style.display = "block";
  document.getElementById("quizScreen").style.display = "none";
}

function reviewMode() {
  review = true;
  current = 0;
  document.getElementById("resultScreen").style.display = "none";
  document.getElementById("quizScreen").style.display = "block";
  showQuestion();
}
</script>
